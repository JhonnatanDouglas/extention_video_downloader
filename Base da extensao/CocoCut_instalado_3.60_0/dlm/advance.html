<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-dlmi18n="t3_alt_media_downloader">Alt Media Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .details {
            text-align: left;
            font-size: 1em;
            margin: 10px 0;
        }

        .details span {
            font-weight: bold;
        }

        #progress {
            width: 100%;
            height: 20px;
            margin-top: 20px;
        }

        .status {
            margin-top: 10px;
            font-size: 1.2em;
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .warnMessage {
            color: red;
        }
    </style>
    <script defer src="./advance.js"></script>
</head>
<body>
    <div class="container">
        <h1 data-dlmi18n="t3_alt_media_downloader">Alternative Media Downloader</h1>

        <div class="details">
            <p><span data-dlmi18n="t3_file_name">File Name: </span><span id="file-name">Not selected</span></p>
            <p><span data-dlmi18n="t3_webpage_title">Webpage Title: </span><span id="webpage-title">Not available</span></p>
            <p><span data-dlmi18n="t3_file_size">File Size: </span> <span id="file-size">Unknown</span></p>
        </div>

        <progress id="progress" value="0" max="100"></progress>
        <div class="status" id="status" data-dlmi18n="t3_ready_to_download">Ready to download</div>
        <div class="warnMessage" id="warnMessage"></div>
        <button id="start-download" data-dlmi18n="t3_start_download">Start Download</button>
    </div>
</body>
</html>
